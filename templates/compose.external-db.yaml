# Standalone stack for an already-running database. Do not merge with
# compose.yaml: Compose interpolates the base file first, so its required
# MYSQL_ROOT_PASSWORD would still be demanded and the db service would still
# be part of the model. This file has no db service and no depends_on.
# Same project name as compose.yaml so motion/model volumes keep their names
# when an operator switches files. Do not `up` both files at once.
name: zerohome

x-app: &app
  image: ${ZEROHOME_IMAGE:-ghcr.io/zerolink-m/zerohome:stable}
  # Supply a host-managed file; it is never copied into the build context.
  env_file:
    - ${ZEROHOME_CONFIG:-/etc/zerohome/app.conf}
  environment:
    DB_HOST: ${DB_HOST:?Set DB_HOST to the external database host}
    DB_PORT: "${DB_PORT:-3306}"
    DB_NAME: ${DB_NAME:-zerocams}
    DB_USER: ${DB_USER:-zerocams}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment configuration}
    HOST: 0.0.0.0
    PORT: "8000"
    CACHE_DIR: /data/cache
    MOTION_FILES_DIR: /data/motion_files
  volumes:
    - motion:/data/motion_files
    - models:/data/models
    - identity:/data/zerocams
  tmpfs:
    - /tmp:mode=1777
    - /data/cache:uid=10001,gid=10001,mode=0700
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  labels:
    com.centurylinklabs.watchtower.enable: "false"

services:
  migrate:
    <<: *app
    profiles: [maintenance]
    restart: "no"
    # Script is copied into the image. GET_LOCK is held for the whole upgrade.
    command: ["python", "/app/deploy/migrate_locked.py"]
    healthcheck:
      disable: true

  app:
    <<: *app
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${ZEROHOME_BIND:-127.0.0.1}:8000:8000"

volumes:
  motion:
  models:
  identity:
